<style>

body{background:#111318;color:#f2f4f8;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

header{padding:10px 12px 8px;background:#171a21;border-bottom:1px solid #262b36}

.chip.on{background:#7a5c12;color:#ffdf85}
.wait .out{color:#7b8698;font-size:18px;font-weight:500}
.err{background:#3a1f22}.err .out{font-size:15px;color:#ff9d9d;font-weight:600;line-height:1.5}
.cat{width:100%;text-align:left;padding:15px 14px;margin-bottom:8px;border-radius:14px;background:#1e2431;font-size:16px;font-weight:700;display:flex;justify-content:space-between}

.pi{width:100%;text-align:left;padding:13px 14px;margin-bottom:7px;border-radius:12px;background:#191e28;border-left:3px solid #2f7cf6;display:block}

<body>
<header>
  <div class="lg">

<main>
  <div class="pg on" id="p-talk">

      <b>파란 버튼</b>을 누르고 한국어로 말하세요.<br>

  </div>
  <div class="pg" id="p-book">

  <div class="pg" id="p-mine">
    <input class="ci" id="mk" placeholder="한국어 문장 (예: 저는 새우를 못 먹어요)">

</main>
<footer id="ft">
  <div class="mics">
    <button class="mic" id="m1">🇰🇷 내가 말하기</button>
    <button class="mic o" id="m2">🇮🇹 상대가 말하기</button>
  </div>
  <div class="tr">
    <input id="tx" placeholder="타이핑으로 번역…">
    <button id="sd">번역</button>

</footer>
<div id="big"><button class="bc" id="bx">닫기 ✕</button><div class="bt" id="bt"></div><div class="bs" id="bs"></div></div>
<script>
const L={it:{n:'이탈리아어',f:'🇮🇹',c:'it-IT',s:'it'},es:{n:'스페인어',f:'🇪🇸',c:'es-ES',s:'es'}};
let cur=localStorage.getItem('lang')||'it';
const $=i=>document.getElementById(i);

/* ================= 음성 출력 (오프라인) ================= */
let vs=[],ul=false;
const lv=()=>{vs=window.speechSynthesis?speechSynthesis.getVoices():[]};lv();
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=lv;
function unlock(){if(ul||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);ul=1;lv()}catch(e){}}
addEventListener('touchend',unlock);addEventListener('click',unlock);
function say(t,c,r){if(!window.speechSynthesis||!t)return;unlock();speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=c;u.rate=r||1;
  const v=vs.find(x=>x.lang.replace('_','-')===c)||vs.find(x=>x.lang.replace('_','-').startsWith(c.split('-')[0]));
  if(v)u.voice=v;setTimeout(()=>speechSynthesis.speak(u),60)}

/* ================= 번역 + 캐시(오프라인 재사용) ================= */
let cache={};try{cache=JSON.parse(localStorage.getItem('tc'))||{}}catch(e){}
function cSet(k,v){cache[k]=v;try{localStorage.setItem('tc',JSON.stringify(cache))}catch(e){}}
async function tr(t,f,to){
  const key=f+'>'+to+'>'+t.trim().toLowerCase();
  if(cache[key])return cache[key];
  const er=[];
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+f+'&tl='+to+'&dt=t&q='+encodeURIComponent(t));
    if(r.ok){const d=await r.json();const s=(d[0]||[]).map(x=>x[0]).join('').trim();if(s){cSet(key,s);return s}er.push('G:빈응답')}
    else er.push('G:'+r.status);
  }catch(e){er.push('G:차단')}
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+f+'|'+to);
    if(r.ok){const d=await r.json();const s=(d.responseData&&d.responseData.translatedText||'').trim();
      if(s&&!/MYMEMORY|INVALID|QUERY LENGTH/i.test(s)){cSet(key,s);return s}er.push('M:거부')}
    else er.push('M:'+r.status);
  }catch(e){er.push('M:차단')}
  throw new Error('번역 서버에 연결 못했어요.\n['+er.join(' / ')+']\n인터넷을 확인하거나 📖문구집을 쓰세요.');
}

/* ================= 대화 ================= */
const log=$('log');
async function run(text,dir){
  if(!text||!text.trim())return;text=text.trim();
  $('hint').style.display='none';
  const b=document.createElement('div');
  b.className='bub wait'+(dir=='me'?' me':'');
  b.innerHTML='<div class="src"></div><div class="out">번역 중…</div>';
  b.querySelector('.src').textContent=text;
  log.appendChild(b);log.parentElement.scrollTop=1e6;
  const f=dir=='me'?'ko':L[cur].s,t2=dir=='me'?L[cur].s:'ko';
  const code=dir=='me'?L[cur].c:'ko-KR';
  try{
    const o=await tr(text,f,t2);
    b.className='bub'+(dir=='me'?' me':'');
    b.innerHTML='<div class="src"></div><div class="out"></div><div class="acts"><button class="chip a1">🔊 다시</button><button class="chip a2">🐢 느리게</button><button class="chip a3">🔍 크게</button><button class="chip a4">⭐ 저장</button></div>';
    b.querySelector('.src').textContent=text;
    b.querySelector('.out').textContent=o;
    b.querySelector('.a1').onclick=()=>say(o,code,1);
    b.querySelector('.a2').onclick=()=>say(o,code,.55);
    b.querySelector('.a3').onclick=()=>big(o,text);
    b.querySelector('.out').onclick=()=>big(o,text);
    b.querySelector('.a4').onclick=e=>{addMine(dir=='me'?text:o,dir=='me'?o:text);e.target.classList.add('on');e.target.textContent='⭐ 저장됨'};
    say(o,code,1);log.parentElement.scrollTop=1e6;
  }catch(e){b.className='bub err';b.innerHTML='<div class="out"></div>';b.querySelector('.out').textContent='⚠️ '+e.message}
}

/* ================= 음성 인식 (아이폰 대응) ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let ing=false,curStop=null;
function labels(){$('m1').textContent='🇰🇷 내가 말하기';$('m2').textContent=L[cur].f+' 상대가 말하기'}
function listen(dir,btn){
  if(!SR){$('st').textContent='이 브라우저는 음성인식 미지원 — 아래 타이핑을 쓰세요';return}
  if(ing){if(curStop)curStop();return}
  unlock();if(window.speechSynthesis)speechSynthesis.cancel();
  const rc=new SR();rc.lang=dir=='me'?'ko-KR':L[cur].c;rc.interimResults=true;rc.continuous=false;
  let fin='',best='',done=false,tmr=null,auto=null;
  function finish(){
    if(done)return;done=true;clearTimeout(tmr);clearTimeout(auto);
    ing=false;curStop=null;btn.classList.remove('rec');labels();
    const txt=(fin.trim()||best.trim());
    if(txt){$('st').textContent='';run(txt,dir)}
    else $('st').textContent='소리가 안 들렸어요. 다시 눌러주세요';
  }
  curStop=()=>{try{rc.stop()}catch(e){};clearTimeout(tmr);tmr=setTimeout(finish,1200)};
  rc.onstart=()=>{ing=true;btn.classList.add('rec');btn.textContent='⏹ 다 말했어요';
    $('st').textContent=dir=='me'?'듣고 있어요…':'Parla / Habla — 말씀하세요';
    auto=setTimeout(()=>{if(!done&&curStop)curStop()},15000)};
  rc.onresult=e=>{let im='';
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)fin+=t;else im+=t}
    if((fin+im).trim())best=fin+im;
    $('st').textContent=(fin+im)||'…'};
  rc.onerror=e=>{
    if(e.error=='not-allowed'||e.error=='service-not-allowed'){done=true;ing=false;curStop=null;btn.classList.remove('rec');labels();$('st').textContent='마이크 권한을 허용해 주세요 (설정 > Safari > 마이크)'}
    else if(e.error=='network'){done=true;ing=false;curStop=null;btn.classList.remove('rec');labels();$('st').textContent='음성인식은 인터넷이 필요해요 (문구집은 오프라인 가능)'}
  };
  rc.onend=finish;
  try{rc.start()}catch(e){$('st').textContent='다시 눌러주세요'}
}
$('m1').onclick=e=>listen('me',e.currentTarget);
$('m2').onclick=e=>listen('you',e.currentTarget);
$('sd').onclick=()=>{const v=$('tx').value;$('tx').value='';$('tx').blur();run(v,'me')};
$('tx').onkeydown=e=>{if(e.key=='Enter')$('sd').click()};

/* ================= 숫자 조절 문구 ================= */
const NIT=['','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici'];
const NES=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
const ADJ=[
{k:n=>n+'명 자리 부탁해요',mn:1,mx:12,df:2,
 it:n=>n==1?'Un tavolo per una persona, per favore':'Un tavolo per '+NIT[n]+', per favore',
 es:n=>n==1?'Una mesa para una persona, por favor':'Una mesa para '+NES[n]+', por favor'},
{k:n=>'저희 '+n+'명이에요',mn:1,mx:12,df:2,
 it:n=>n==1?'Sono da solo':'Siamo in '+NIT[n],
 es:n=>n==1?'Vengo solo':'Somos '+NES[n]},
{k:n=>'이거 '+n+'개 주세요',mn:1,mx:12,df:2,
 it:n=>'Ne vorrei '+NIT[n]+', per favore',
 es:n=>'Quiero '+NES[n]+', por favor'},
{k:n=>n+'인분 주세요',mn:1,mx:12,df:2,
 it:n=>n==1?'Una porzione, per favore':NIT[n]+' porzioni, per favore',
 es:n=>n==1?'Una ración, por favor':NES[n]+' raciones, por favor'},
{k:n=>'표 '+n+'장 주세요',mn:1,mx:12,df:2,
 it:n=>n==1?'Un biglietto, per favore':NIT[n]+' biglietti, per favore',
 es:n=>n==1?'Un billete, por favor':NES[n]+' billetes, por favor'},
{k:n=>'어른 '+n+'명 입장권이요',mn:1,mx:12,df:2,
 it:n=>n==1?'Un ingresso per adulto, per favore':NIT[n]+' ingressi per adulti, per favore',
 es:n=>n==1?'Una entrada para adulto, por favor':NES[n]+' entradas para adultos, por favor'},
{k:n=>'커피 '+n+'잔 주세요',mn:1,mx:12,df:2,
 it:n=>n==1?'Un caffè, per favore':NIT[n]+' caffè, per favore',
 es:n=>n==1?'Un café, por favor':NES[n]+' cafés, por favor'},
{k:n=>n+'박 묶을 거예요',mn:1,mx:12,df:2,
 it:n=>n==1?'Resto una notte':'Resto '+NIT[n]+' notti',
 es:n=>n==1?'Me quedo una noche':'Me quedo '+NES[n]+' noches'},
{k:n=>n+'시에 예약했어요',mn:7,mx:23,df:19,
 it:n=>'Ho una prenotazione alle '+n,
 es:n=>'Tengo una reserva a las '+n}
];

/* ================= 문구집 ================= */
const B=[
['💬 인사·기본',[['안녕하세요 (낮)','Buongiorno','Buenos días'],['안녕하세요 (저녁)','Buonasera','Buenas tardes'],['감사합니다','Grazie mille','Muchas gracias'],['실례합니다','Mi scusi','Perdone'],['부탁합니다','Per favore','Por favor'],['영어 하세요?','Parla inglese?','¿Habla inglés?'],['한국에서 왔어요','Vengo dalla Corea','Soy de Corea']]],
['🍝 식당',[['메뉴판 주세요','Il menù, per favore','La carta, por favor'],['추천해 주세요','Cosa mi consiglia?','¿Qué me recomienda?'],['이거 주세요','Prendo questo','Quiero esto, por favor'],['생수 주세요','Acqua naturale, per favore','Agua sin gas, por favor'],['계산서 주세요','Il conto, per favore','La cuenta, por favor'],['카드 되나요?','Posso pagare con la carta?','¿Puedo pagar con tarjeta?'],['포장해 주세요','Da portare via','Para llevar'],['화장실 어디예요?',"Dov'è il bagno?",'¿Dónde está el baño?']]],
['⚠️ 알레르기',[['견과류 알레르기가 있어요','Sono allergico alla frutta secca','Soy alérgico a los frutos secos'],['갑각류 알레르기가 있어요','Sono allergico ai crostacei','Soy alérgico al marisco'],['우유가 들어있나요?','Contiene latte?','¿Contiene leche?'],['채식주의자예요','Sono vegetariano','Soy vegetariano'],['매운 건 못 먹어요','Non posso mangiare piccante','No puedo comer picante']]],
['🚆 길·교통',[['여기 어떻게 가요?','Come arrivo qui?','¿Cómo llego aquí?'],['역이 어디예요?',"Dov'è la stazione?",'¿Dónde está la estación?'],['몇 시에 출발해요?','A che ora parte?','¿A qué hora sale?'],['걸어서 얼마나 걸려요?','Quanto ci vuole a piedi?','¿Cuánto se tarda andando?'],['여기서 세워 주세요','Si fermi qui','Pare aquí, por favor']]],
['🛍 쇼핑',[['얼마예요?','Quanto costa?','¿Cuánto cuesta?'],['너무 비싸요','È troppo caro','Es demasiado caro'],['깎아 주실 수 있나요?','Può farmi uno sconto?','¿Me puede hacer un descuento?'],['입어봐도 되나요?','Posso provarlo?','¿Me lo puedo probar?'],['그냥 구경중이에요','Sto solo guardando','Solo estoy mirando'],['영수증 주세요','La ricevuta, per favore','El recibo, por favor']]],

function adjRow(a){
  let n=a.df;
  const p=document.createElement('div');p.className='pi adj';
  p.innerHTML='<div class="ko"></div><div class="fr"></div><div class="stp"><button class="sb mi">−</button><span class="sv"></span><button class="sb pl2">＋</button><button class="spk">🔊 말하기</button></div>';
  const ko=p.querySelector('.ko'),fr=p.querySelector('.fr'),sv=p.querySelector('.sv');
  function draw(){const t=a[cur](n);ko.textContent=a.k(n);fr.textContent=t;sv.textContent=n+(a.mx>12?'시':'');return t}
  p.querySelector('.mi').onclick=e=>{e.stopPropagation();if(n>a.mn)n--;draw()};
  p.querySelector('.pl2').onclick=e=>{e.stopPropagation();if(n<a.mx)n++;draw()};
  p.querySelector('.spk').onclick=e=>{e.stopPropagation();const t=draw();say(t,L[cur].c,1);big(t,a.k(n))};
  fr.onclick=()=>{const t=draw();say(t,L[cur].c,1);big(t,a.k(n))};
  draw();return p;
}
function book(q){
  const w=$('bw');w.innerHTML='';q=(q||'').trim();
  if(!q){
    const cb=document.createElement('button');cb.className='cat';
    cb.innerHTML='<span>🔢 숫자로 조절 (인원·개수·시간)</span><span class="arw">'+ADJ.length+'개 ▾</span>';w.appendChild(cb);
    const pl=document.createElement('div');pl.className='pl';
    ADJ.forEach(a=>pl.appendChild(adjRow(a)));
    w.appendChild(pl);cb.onclick=()=>pl.classList.toggle('on');
  }
  B.forEach(([c,its])=>{
    const list=q?its.filter(i=>i[0].includes(q)):its;
    if(!list.length)return;
    const cb=document.createElement('button');cb.className='cat';
    cb.innerHTML='<span>'+c+'</span><span class="arw">'+list.length+'개 ▾</span>';w.appendChild(cb);
    const pl=document.createElement('div');pl.className='pl'+(q?' on':'');
    list.forEach(i=>{const p=document.createElement('button');p.className='pi';
      const f=cur=='it'?i[1]:i[2];
      p.innerHTML='<div class="ko"></div><div class="fr"></div>';
      p.querySelector('.ko').textContent=i[0];p.querySelector('.fr').textContent=f;
      p.onclick=()=>{say(f,L[cur].c,1);big(f,i[0])};pl.appendChild(p)});
    w.appendChild(pl);cb.onclick=()=>pl.classList.toggle('on')});
  if(!w.children.length)w.innerHTML='<div class="hint">검색 결과가 없어요</div>';
}
$('srch').oninput=e=>book(e.target.value);

/* ================= 내 문장 ================= */
function getMine(){try{return JSON.parse(localStorage.getItem('mine'))||[]}catch(e){return[]}}
function setMine(a){localStorage.setItem('mine',JSON.stringify(a.slice(0,200)))}
function addMine(ko,fr){const a=getMine();a.unshift({ko:ko,fr:fr,lang:cur});setMine(a);mine()}
function mine(){
  const w=$('mw'),a=getMine().filter(x=>x.lang==cur);
  if(!a.length){w.innerHTML='<div class="hint">여기에 추가한 문장은 <b>폰에 저장</b>돼서<br>인터넷이 없어도 계속 쓸 수 있어요.<br><br>알레르기, 숙소 이름, 자주 쓸 말을<br>미리 넣어두면 좋아요.</div>';return}
  w.innerHTML='';
  a.forEach(x=>{
    const row=document.createElement('div');row.className='mrow';
    const p=document.createElement('button');p.className='pi';p.style.flex='1';
    p.innerHTML='<div class="ko"></div><div class="fr"></div>';
    p.querySelector('.ko').textContent=x.ko;p.querySelector('.fr').textContent=x.fr;
    p.onclick=()=>{say(x.fr,L[cur].c,1);big(x.fr,x.ko)};
    const d=document.createElement('button');d.className='del';d.textContent='✕';
    d.onclick=()=>{if(confirm('삭제할까요?')){const all=getMine();const i=all.findIndex(y=>y.ko==x.ko&&y.fr==x.fr&&y.lang==x.lang);if(i>-1)all.splice(i,1);setMine(all);mine()}};
    row.appendChild(p);row.appendChild(d);w.appendChild(row)});
}
$('madd').onclick=async()=>{
  const ko=$('mk').value.trim(),fr=$('mf').value.trim();
  if(!ko&&!fr){alert('문장을 입력해 주세요');return}
  if(fr){addMine(ko||fr,fr);$('mk').value='';$('mf').value='';return}
  $('madd').textContent='번역 중…';
  try{const o=await tr(ko,'ko',L[cur].s);addMine(ko,o);$('mk').value='';$('mf').value=''}
  catch(e){alert('자동 번역 실패 😢\n\n'+e.message+'\n\n아래 칸에 현지어를 직접 적어서 추가할 수도 있어요.')}
  $('madd').textContent='＋ 내 문장에 추가';
};
